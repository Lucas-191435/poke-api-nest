services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}

    container_name: poke-api-nest

    restart: unless-stopped

    env_file:
      - .env.prod

    ports:
      - "4001:4001"

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    networks:
      - shared-network

networks:
  shared-network:
    external: true